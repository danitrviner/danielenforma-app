<!doctype html>
<html class="dark" lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0 + user-scalable=no: WKWebView (app nativa) amplía la
         página sola al enfocar un <input>/<textarea> con fuente < 16px y no la
         devuelve al desenfocar — de ahí que el onboarding se viera "aumentado"
         y descuadrado en iOS. Esto evita el auto-zoom por foco; el suelo de
         16px en los controles de formulario (src/index.css) es la otra mitad
         del arreglo, para que ni siquiera llegue a dispararse. En Safari móvil
         (no WKWebView) user-scalable=no no se respeta, así que esto no quita
         el pinch-zoom accesible fuera de la app nativa. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>En Forma</title>
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Las CUATRO fuentes son self-host (src/index.css): Archivo, Plus Jakarta
         Sans e IBM Plex Mono vía @fontsource, y Material Symbols como
         subconjunto commiteado de los iconos que la app usa.
         Aquí había un <link rel="stylesheet"> a fonts.googleapis.com para los
         iconos: render-blocking, 572 ms con banda ancha, y sin cobertura los
         iconos salían como el texto de su ligadura (06-1 / 07-5). Ya no queda
         ninguna petición a Google en el arranque, que es lo que la app
         necesita para abrir en el sótano de un gimnasio. -->
  </head>
  <body class="bg-bg text-ink antialiased min-h-screen selection:bg-accent selection:text-on-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
